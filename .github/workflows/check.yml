name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Every Lumovi reads this repository: sponsor.json and its pictures, as the app checks them.
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node check.ts
      # The rules the app checks what it reads against, and this repository's copy of them, the
      # same: a change to the app's comes here too, so the two can't drift apart.
      - name: rules.ts is the app's
        run: |
          curl -fsSL https://raw.githubusercontent.com/Lumovi/Lumovi/refs/heads/main/src/backend/sponsor/rules.ts -o "$RUNNER_TEMP/app-rules.ts"
          diff -u "$RUNNER_TEMP/app-rules.ts" rules.ts
